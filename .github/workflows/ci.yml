name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run server tests
        run: npm --prefix server test

      - name: Type-check client
        run: npm --prefix client run typecheck

      - name: Build client
        run: npm --prefix client run build

      - name: Check server JavaScript syntax
        run: |
          node --check server/config.js
          node --check server/server.js
          node --check server/roomManager.js
          node --check server/roomHandlers.js
          node --check server/gameManager.js
          node --check server/gameRegistry.js
          node --check server/games/fake-answer/game.js
          node --check server/games/fake-answer/questionLibrary.js
          node --check server/games/fake-answer/socketHandlers.js
          node --check server/games/fake-answer/questionBank.js
          node --check server/games/fake-answer/scripts/validate-question-pack.js
          node --check server/test/config.test.js
          node --check server/test/questionLibrary.test.js
          node --check server/test/roomManager.test.js
          node --check server/test/gameManager.test.js
          node --check server/test/server.test.js
